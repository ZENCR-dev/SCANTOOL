name: Deploy scanner to GitHub Pages

on:
  push:
    branches: [dev, main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          touch web/.nojekyll
          # 使用仓库内已提交的 config.js；若缺失则用 example 占位
          if [ ! -f web/config.js ]; then
            cp web/config.example.js web/config.js
          fi
          # 确保同码闩模块随站点发布
          test -f web/scan-feedback.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
