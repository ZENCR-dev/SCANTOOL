<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>收货扫码</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f5f5;
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-raised: #222222;
      --border: #444444;
      --border-subtle: #333333;
      --action: #22aa66;
      --flash-ok: #1b5e20;
      --flash-dup: #e65100;
      --flash-miss: #455a64;
      --flash-err: #b71c1c;
      --flash-wait: #1565c0;
      --control-secondary: #333333;
      --space-xs: 8px;
      --space-sm: 10px;
      --space-md: 12px;
      --space-lg: 16px;
      --radius-control: 8px;
      --tap: 48px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    header {
      padding: var(--space-sm) var(--space-lg);
      padding-top: max(var(--space-sm), env(safe-area-inset-top, 0px));
      background: var(--surface);
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    body.scanning header { display: none; }

    #session-bar {
      display: none;
      padding: var(--space-sm) var(--space-lg);
      padding-top: max(var(--space-sm), env(safe-area-inset-top, 0px));
      background: var(--surface-raised);
      border-bottom: 1px solid var(--border-subtle);
      gap: var(--space-xs);
      align-items: baseline;
    }
    #session-bar.visible { display: flex; }
    #sessionTitle {
      flex: 1;
      font-weight: 600;
      font-size: 1rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #sessionStats {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .panel { padding: var(--space-md) var(--space-lg); }
    label {
      display: block;
      font-size: 0.85rem;
      color: #d0d0d0;
      margin-bottom: 4px;
    }
    input, button, select {
      font: inherit;
      width: 100%;
      min-height: var(--tap);
      padding: var(--space-md);
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: inherit;
    }
    button {
      margin-top: var(--space-xs);
      background: var(--action);
      border-color: var(--action);
      color: #fff;
      font-weight: 600;
    }
    button.secondary {
      background: var(--control-secondary);
      border-color: #555;
      color: var(--ink);
    }
    button:disabled { opacity: 0.5; }
    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* 仓口色块：全宽贴边 slab + 三层文案 */
    #flash {
      position: relative;
      margin: 0;
      padding: 28px var(--space-lg);
      border-radius: 0;
      text-align: center;
      min-height: 28dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface-raised);
      overflow: hidden;
      transition: background-color 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    body:not(.scanning) #flash {
      margin: var(--space-md) var(--space-lg);
      border-radius: 12px;
      min-height: 100px;
    }
    #flash.ok { background: var(--flash-ok); }
    #flash.dup { background: var(--flash-dup); }
    #flash.miss { background: var(--flash-miss); }
    #flash.err { background: var(--flash-err); }
    #flash.wait { background: var(--flash-wait); }
    .flash-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.5rem, 12vw, 4rem);
      font-weight: 800;
      opacity: 0.45;
      pointer-events: none;
      color: var(--ink);
      line-height: 1;
      white-space: nowrap;
    }
    .flash-primary {
      position: relative;
      z-index: 1;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
      word-break: break-word;
      max-width: 100%;
    }
    .flash-secondary {
      position: relative;
      z-index: 1;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(245, 245, 245, 0.55);
      word-break: break-all;
    }
    .flash-secondary:empty { display: none; }

    #reader {
      width: 100%;
      margin: 0 auto;
      background: #000;
    }
    body.scanning #reader {
      min-height: 32dvh;
    }
    body.scanning #reader video {
      width: 100% !important;
      max-height: 40dvh;
      object-fit: cover;
    }
    #scanHint {
      display: none;
      padding: 6px var(--space-lg);
      font-size: 0.85rem;
      color: #c8c8c8;
      text-align: center;
    }
    body.scanning #scanHint { display: block; }

    /* 拇指区底栏 */
    #dock {
      display: none;
      position: sticky;
      bottom: 0;
      z-index: 10;
      padding: var(--space-md) var(--space-lg);
      padding-bottom: max(var(--space-md), env(safe-area-inset-bottom, 0px));
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
      gap: var(--space-xs);
      flex-direction: column;
    }
    body.scanning #dock { display: flex; }
    #dock .dock-row {
      display: flex;
      gap: var(--space-xs);
    }
    #dock .dock-row button {
      flex: 1;
      margin-top: 0;
      min-height: var(--tap);
    }
    #btnResume { display: none; }
    body.scanning.paused #btnResume { display: block; }
    body.scanning.paused #btnStop { display: none; }

    #pending {
      padding: var(--space-xs) var(--space-lg) var(--space-lg);
      font-size: 1rem;
    }
    body.scanning #pending {
      padding-bottom: var(--space-xs);
    }
    #pending details {
      background: var(--surface);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-control);
    }
    #pending summary {
      min-height: 40px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    #pending ul {
      margin: var(--space-xs) 0 0;
      padding-left: 1.2em;
      max-height: 100px;
      overflow: auto;
    }
    .hint {
      font-size: 0.85rem;
      color: #c8c8c8;
      margin-top: var(--space-xs);
    }
    .row {
      display: flex;
      gap: var(--space-xs);
      padding: 0 var(--space-lg) var(--space-md);
    }
    body.scanning .row.mount-only { display: none; }
    .row button { flex: 1; margin-top: 0; }
    details.advanced {
      margin-top: var(--space-md);
      font-size: 0.85rem;
      color: #d0d0d0;
    }
    body.scanning #mount-panel { display: none; }

    @media (prefers-reduced-motion: reduce) {
      #flash { transition: none; }
    }
  </style>
</head>
<body>
  <header><h1>收货扫码</h1></header>

  <div id="session-bar">
    <div id="sessionTitle">—</div>
    <div id="sessionStats">已收 — / —</div>
  </div>

  <div class="panel" id="mount-panel">
    <label for="batchSelect">选择批次</label>
    <select id="batchSelect"></select>
    <div id="customSheetWrap" hidden style="margin-top:12px">
      <label for="sheetUrl">自定义收货表链接或 ID</label>
      <input id="sheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." />
    </div>
    <button id="btnConnect" type="button">挂载并开扫</button>
    <details class="advanced">
      <summary>高级：Web App URL</summary>
      <label for="apiUrl" style="margin-top:8px">Apps Script Web App URL</label>
      <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
    </details>
    <p class="hint">须用 https 打开。挂载成功后自动开摄像头。</p>
  </div>

  <div id="flash">
    <div class="flash-watermark" id="flashWatermark" aria-hidden="true"></div>
    <div class="flash-primary" id="flashPrimary">等待挂载</div>
    <div class="flash-secondary" id="flashSecondary"></div>
  </div>

  <div id="reader"></div>
  <p id="scanHint">横向对准条码；略拉开距离对焦更稳。褶皱处可换角度。</p>

  <div id="dock">
    <div class="dock-row">
      <button id="btnStop" class="secondary" type="button">停止</button>
      <button id="btnResume" type="button">继续扫码</button>
      <button id="btnSwapBatch" class="secondary" type="button">换批</button>
    </div>
  </div>

  <div id="pending">
    <details>
      <summary>未收列表</summary>
      <ul id="pendingList"></ul>
    </details>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
