<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>收货扫码</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f5f5f5;
      min-height: 100dvh;
    }
    header { padding: 10px 16px; background: #1a1a1a; }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    #session-bar {
      display: none;
      padding: 10px 16px;
      background: #222;
      border-bottom: 1px solid #333;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #session-bar.visible { display: flex; }
    #sessionTitle { flex: 1; font-weight: 600; font-size: 0.95rem; min-width: 0; word-break: break-all; }
    #sessionStats { font-size: 0.9rem; opacity: 0.9; white-space: nowrap; }
    #btnSwapBatch {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 0.85rem;
      background: #444;
      border-color: #555;
    }
    .panel { padding: 12px 16px; }
    label { display: block; font-size: 0.85rem; opacity: 0.8; margin-bottom: 4px; }
    input, button, select {
      font: inherit;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: inherit;
    }
    button { margin-top: 8px; background: #2a6; border-color: #2a6; color: #fff; font-weight: 600; }
    button.secondary { background: #333; border-color: #555; }
    button:disabled { opacity: 0.5; }
    #flash {
      margin: 12px 16px;
      padding: 28px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      white-space: pre-line;
    }
    #flash.ok { background: #1b5e20; }
    #flash.dup { background: #e65100; }
    #flash.miss { background: #37474f; }
    #flash.err { background: #b71c1c; }
    #flash.wait { background: #1565c0; }
    #reader { width: 100%; margin: 0 auto; }
    #pending { padding: 8px 16px 24px; font-size: 0.9rem; }
    #pending details { background: #1a1a1a; padding: 8px 12px; border-radius: 8px; }
    #pending ul { margin: 8px 0 0; padding-left: 1.2em; max-height: 120px; overflow: auto; }
    .hint { font-size: 0.8rem; opacity: 0.65; margin-top: 8px; }
    .row { display: flex; gap: 8px; padding: 0 16px 12px; }
    .row button { flex: 1; margin-top: 0; }
    details.advanced { margin-top: 12px; font-size: 0.85rem; opacity: 0.85; }
    body.scanning #mount-panel { display: none; }
  </style>
</head>
<body>
  <header><h1>收货扫码</h1></header>

  <div id="session-bar">
    <div id="sessionTitle">—</div>
    <div id="sessionStats">已收 — / —</div>
    <button id="btnSwapBatch" type="button" class="secondary">换批</button>
  </div>

  <div class="panel" id="mount-panel">
    <label for="batchSelect">选择批次</label>
    <select id="batchSelect"></select>
    <div id="customSheetWrap" hidden style="margin-top:12px">
      <label for="sheetUrl">自定义收货表链接或 ID</label>
      <input id="sheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." />
    </div>
    <button id="btnConnect" type="button">挂载</button>
    <details class="advanced">
      <summary>高级：Web App URL</summary>
      <label for="apiUrl" style="margin-top:8px">Apps Script Web App URL</label>
      <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
    </details>
    <p class="hint">地址栏须为 <strong>https://</strong>。挂载后进入扫码主屏。</p>
  </div>

  <div id="flash">等待挂载</div>

  <div id="reader"></div>
  <div class="row">
    <button id="btnStart" class="secondary" type="button" disabled>开始扫码</button>
    <button id="btnStop" class="secondary" type="button" disabled>停止</button>
  </div>

  <div id="pending">
    <details>
      <summary>未收列表</summary>
      <ul id="pendingList"></ul>
    </details>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
